# Drop-in snippet for /etc/nginx/conf.d/ - Unraid's main nginx.conf includes
# /etc/nginx/conf.d/*.conf, so this keeps the frontend and its API calls on
# the same origin as the rest of the webGUI (no CORS, no iframe framing
# issues). Static assets are served directly by nginx from the plugin's own
# directory; only the dynamic API path is proxied to the Node daemon.

location /plugins/unraid-disklocation-next/api/ {
  proxy_pass http://127.0.0.1:3838/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
}
