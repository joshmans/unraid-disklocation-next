# This location block itself keeps the frontend and its API calls on the
# same origin as the rest of the webGUI (no CORS, no iframe framing issues).
# Static assets are served directly by nginx from the plugin's own directory;
# only the dynamic API path is proxied to the Node daemon.
#
# How this actually gets loaded (verified against a real box, 2026-09 - see
# ROADMAP.md's UI-delivery correction): Unraid's nginx.conf does NOT
# wildcard-include /etc/nginx/conf.d/*.conf - dropping this file into conf.d/
# alone does nothing. Persist it at
# /boot/config/plugins/unraid-disklocation-next/nginx/unraid-disklocation-next.conf
# and get it read by appending one line to /etc/nginx/conf.d/locations.conf:
#   include /boot/config/plugins/unraid-disklocation-next/nginx/unraid-disklocation-next.conf;
# (same pattern the real u-manager-companion plugin already uses). Note
# `/etc/rc.d/rc.nginx reload` regenerates locations.conf and wipes a
# hand-appended include - this is still an open question for how a real
# install script makes that line durable across reloads.

location /plugins/unraid-disklocation-next/api/ {
  proxy_pass http://127.0.0.1:3838/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
}
